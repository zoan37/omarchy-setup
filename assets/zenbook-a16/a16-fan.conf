# /etc/default/a16-fan: tuning for a16-fan-daemon v3 "whisper" (temperatures in millidegrees C).
# Values only on assignment lines: systemd passes inline comments through as part of the value.
# Fan turns on when the smoothed temperature exceeds ON_C; the SoC is rated for 95 C, so run it warm and quiet.
ON_C=68000
# May turn off once the smoothed temperature has been below OFF_C for OFF_HOLD_S (and on for MIN_ON_S).
OFF_C=58000
OFF_HOLD_S=120
MIN_ON_S=180
# Smoothing weight per 3 s sample: 5 = ~60 s time constant, so sub-minute bursts never reach the fan.
ALPHA_PCT=5
# Whisper duty: lowest PWM that reliably starts from rest (~800 rpm on this fan).
PWM_MIN=30
# Duty while the fan is "off": 0 stops it; 25-30 keeps an always-on whisper floor (Mac-style, ~700-800 rpm).
IDLE_PWM=30
# Ramp up: 1 count per 3 s normally, UP_STEP_HOT above HOT_C (smoothed), UP_STEP_FAST while the fast path is engaged.
UP_STEP=1
UP_STEP_HOT=4
UP_STEP_FAST=8
HOT_C=82000
# Fast path: engages when a ~10 s average (FAST_ALPHA_PCT per 3 s) passes FAST_C, releases FAST_HYST below it.
FAST_C=88000
FAST_HYST=5000
FAST_ALPHA_PCT=25
# Ramp down: each 3 s the duty may fall by pwm/DOWN_DIV (at least 1), an exponential fade like a Mac's spin-down.
DOWN_DIV=25
# Hand control back to the EC's own curve at TRIP_C (kernel passive throttling starts at 95 C).
TRIP_C=97000
# Smoothed temp -> duty knots (linear between).
CURVE=68000:30 78000:45 85000:90 90000:150 95000:220
