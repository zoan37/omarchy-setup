# /etc/default/a16-fan: tuning for a16-fan-daemon (temperatures in millidegrees C).
# Whisper-style policy: tolerate bursts (installs, page loads) with the fan off; spin up only for sustained heat.
# No inline comments on value lines (systemd passes them through verbatim).
# ON_C: smoothed CPU temp that turns the fan on
ON_C=60000
# OFF_C: smoothed temp below which it may turn off (after OFF_HOLD_S)
OFF_C=50000
# FAST_C: instantaneous temp that bypasses smoothing and ramps hard
FAST_C=78000
# TRIP_C: hand control back to the EC's own curve
TRIP_C=85000
# ALPHA_PCT: smoothing weight per 3 s sample (6 = ~50 s time constant)
ALPHA_PCT=6
# MIN_ON_S: once on, stay on at least this long
MIN_ON_S=120
# OFF_HOLD_S: smoothed temp must stay below OFF_C this long before turning off
OFF_HOLD_S=60
# UP_STEP / DOWN_STEP: duty change per 3 s
UP_STEP=6
DOWN_STEP=3
