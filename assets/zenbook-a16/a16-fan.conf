# /etc/default/a16-fan: tuning for a16-fan-daemon (millidegrees). Whisper-style policy:
# tolerate bursts (short installs, page loads) with the fan off; spin up only for sustained heat.
ON_C=60000        # smoothed CPU temp that turns the fan on
OFF_C=50000       # smoothed temp below which it may turn off (after OFF_HOLD_S)
FAST_C=78000      # instantaneous temp that bypasses smoothing and ramps hard
TRIP_C=85000      # hand control back to the EC's own curve
ALPHA_PCT=6       # smoothing weight per 3 s sample (6 = ~50 s time constant)
MIN_ON_S=120      # once on, stay on at least this long
OFF_HOLD_S=60     # smoothed temp must stay below OFF_C this long before turning off
UP_STEP=6         # duty rise per 3 s
DOWN_STEP=3       # duty fall per 3 s
