# /etc/default/a16-whine: read by a16-whine-tweaks.service. Values only on assignment lines (systemd keeps inline
# comments as part of the value). Remove or edit a line to change the trade-off; `a16-whine-tweaks off` restores stock.
# PCIe generation for the NVMe SSD link (stock 4) and the Wi-Fi card link (stock 3)
NVME_GEN=1
WIFI_GEN=1
# CPUs to take offline (cpu6-17 are the two 4.4 GHz clusters; cpu0-5 is the 3.6 GHz cluster)
OFFLINE_CPUS=6-17
# fixed clock for the remaining cluster: scaling_min_freq = scaling_max_freq in kHz (stock 355200 / 3609600).
# One clock = one voltage = no regulator transitions; ear-judged: 3.6 steadier than 2.5 (oscillates) or 1.5 (more static).
MIN_KHZ=3609600
MAX_KHZ=3609600
# force runtime PM "on" (never suspend) for USB/PCI/platform devices except the GPU: on|off
RUNTIME_PM=on
# stop the unused compute DSP (adsp stays up for audio): 1|0
STOP_CDSP=1
