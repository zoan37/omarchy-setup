# /etc/default/a16-whine: read by a16-whine-tweaks.service. Values only on assignment lines (systemd keeps inline
# comments as part of the value). Remove or edit a line to change the trade-off; `a16-whine-tweaks off` restores stock.
# PCIe generation for the NVMe SSD link (stock 4) and the Wi-Fi card link (stock 3)
NVME_GEN=1
WIFI_GEN=1
# CPUs to take offline. cpu0-5 = 3.6 GHz cluster, cpu6-11 and cpu12-17 = the two 4.45 GHz clusters (own rails).
# Ear-judged 2026-09-26: running only cpu6-11 at a fixed 4.45 GHz beat cpu0-5 at a fixed 3.6 GHz (A/B/A/B).
# 2026-09-27, after the pad/putty mod: cpu6-11 pinned at 3.63 GHz chosen (4.45 vs stock sounded the same by then).
OFFLINE_CPUS=0-5,12-17
# fixed clock for the remaining cluster: scaling_min_freq = scaling_max_freq in kHz (stock 355200 / cpuinfo_max).
# One clock = one voltage = no regulator transitions. On cpu0-5: 3.6 steadier than 2.5 (oscillates) or 1.5 (static).
MIN_KHZ=3628800
MAX_KHZ=3628800
# force runtime PM "on" (never suspend) for USB/PCI/platform devices except the GPU and the audio path
# (soundwire controllers + WSA884x speaker amps stay auto, i.e. asleep when silent): on|off
RUNTIME_PM=on
# stop the unused compute DSP (adsp stays up for audio): 1|0
STOP_CDSP=1
