# Asus Zenbook A16 (UX3607OA) speaker boost. Variant: soft.
# GENERATED by build-variants.py from ASUS's Windows Dolby tuning -- edit that, not this. Custom, not shipped by Omarchy;
# `omarchy audio tuning off` removes it.
#
# The speaker sink is 4ch: FL/FR are the woofers, RL/RR the tweeters (mic-measured
# 2026-09-26). Stock PipeWire only fills FL/FR from stereo, so the tweeters were
# silent. This graph:
#   - cuts sub-bass below 80 Hz the woofers can't reproduce (frees limiter headroom)
#   - adds +6 dB of gain into a lookahead limiter capped at -1 dBFS, so quiet and
#     mid-level material gets louder while peaks stay below the stock maximum
#   - feeds the woofers full range (as before) and the tweeters through a
#     2 kHz 4th-order highpass (-3 dB trim), so they never see bass
# Tweeter sides are crossed on this machine: RL = right tweeter, RR = left tweeter.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = sub_l label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin name = sub_r label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
          # ASUS speaker correction (soft): optimizer bands, then speaker PEQ
          { type = builtin name = eq00_l label = bq_peaking control = { "Freq" = 47.0 "Q" = 0.500 "Gain" = -4.85 } }
          { type = builtin name = eq01_l label = bq_peaking control = { "Freq" = 141.0 "Q" = 0.561 "Gain" = 3.78 } }
          { type = builtin name = eq02_l label = bq_peaking control = { "Freq" = 234.0 "Q" = 1.150 "Gain" = 3.51 } }
          { type = builtin name = eq03_l label = bq_peaking control = { "Freq" = 328.0 "Q" = 1.410 "Gain" = -4.65 } }
          { type = builtin name = eq04_l label = bq_peaking control = { "Freq" = 469.0 "Q" = 1.414 "Gain" = -3.07 } }
          { type = builtin name = eq05_l label = bq_peaking control = { "Freq" = 656.0 "Q" = 1.678 "Gain" = 3.10 } }
          { type = builtin name = eq06_l label = bq_peaking control = { "Freq" = 844.0 "Q" = 2.193 "Gain" = -2.92 } }
          { type = builtin name = eq07_l label = bq_peaking control = { "Freq" = 1031.0 "Q" = 2.245 "Gain" = -2.92 } }
          { type = builtin name = eq08_l label = bq_peaking control = { "Freq" = 1313.0 "Q" = 2.008 "Gain" = -6.21 } }
          { type = builtin name = eq09_l label = bq_peaking control = { "Freq" = 1688.0 "Q" = 1.834 "Gain" = 3.83 } }
          { type = builtin name = eq10_l label = bq_peaking control = { "Freq" = 2250.0 "Q" = 1.715 "Gain" = -5.15 } }
          { type = builtin name = eq11_l label = bq_peaking control = { "Freq" = 3000.0 "Q" = 1.936 "Gain" = -1.15 } }
          { type = builtin name = eq12_l label = bq_peaking control = { "Freq" = 3750.0 "Q" = 2.222 "Gain" = -3.31 } }
          { type = builtin name = eq13_l label = bq_peaking control = { "Freq" = 4688.0 "Q" = 2.263 "Gain" = -0.01 } }
          { type = builtin name = eq14_l label = bq_peaking control = { "Freq" = 5813.0 "Q" = 2.372 "Gain" = -1.05 } }
          { type = builtin name = eq15_l label = bq_peaking control = { "Freq" = 7125.0 "Q" = 2.270 "Gain" = -2.93 } }
          { type = builtin name = eq16_l label = bq_peaking control = { "Freq" = 9000.0 "Q" = 2.170 "Gain" = 2.37 } }
          { type = builtin name = eq17_l label = bq_peaking control = { "Freq" = 11250.0 "Q" = 2.292 "Gain" = -1.34 } }
          { type = builtin name = eq18_l label = bq_peaking control = { "Freq" = 13875.0 "Q" = 1.764 "Gain" = -4.16 } }
          { type = builtin name = eq19_l label = bq_highshelf control = { "Freq" = 16528.0 "Q" = 0.707 "Gain" = -10.64 } }
          { type = builtin name = eq20_l label = bq_peaking control = { "Freq" = 380.0 "Q" = 5.000 "Gain" = -4.00 } }
          { type = builtin name = eq21_l label = bq_peaking control = { "Freq" = 495.0 "Q" = 5.000 "Gain" = -9.30 } }
          { type = builtin name = eq22_l label = bq_peaking control = { "Freq" = 1450.0 "Q" = 4.000 "Gain" = 4.00 } }
          { type = builtin name = eq23_l label = bq_peaking control = { "Freq" = 7900.0 "Q" = 6.000 "Gain" = -5.00 } }
          { type = builtin name = eq00_r label = bq_peaking control = { "Freq" = 47.0 "Q" = 0.500 "Gain" = -4.85 } }
          { type = builtin name = eq01_r label = bq_peaking control = { "Freq" = 141.0 "Q" = 0.561 "Gain" = 3.78 } }
          { type = builtin name = eq02_r label = bq_peaking control = { "Freq" = 234.0 "Q" = 1.150 "Gain" = 3.51 } }
          { type = builtin name = eq03_r label = bq_peaking control = { "Freq" = 328.0 "Q" = 1.410 "Gain" = -4.65 } }
          { type = builtin name = eq04_r label = bq_peaking control = { "Freq" = 469.0 "Q" = 1.414 "Gain" = -3.07 } }
          { type = builtin name = eq05_r label = bq_peaking control = { "Freq" = 656.0 "Q" = 1.678 "Gain" = 3.10 } }
          { type = builtin name = eq06_r label = bq_peaking control = { "Freq" = 844.0 "Q" = 2.193 "Gain" = -2.92 } }
          { type = builtin name = eq07_r label = bq_peaking control = { "Freq" = 1031.0 "Q" = 2.245 "Gain" = -2.92 } }
          { type = builtin name = eq08_r label = bq_peaking control = { "Freq" = 1313.0 "Q" = 2.008 "Gain" = -6.21 } }
          { type = builtin name = eq09_r label = bq_peaking control = { "Freq" = 1688.0 "Q" = 1.834 "Gain" = 3.83 } }
          { type = builtin name = eq10_r label = bq_peaking control = { "Freq" = 2250.0 "Q" = 1.715 "Gain" = -5.15 } }
          { type = builtin name = eq11_r label = bq_peaking control = { "Freq" = 3000.0 "Q" = 1.936 "Gain" = -1.15 } }
          { type = builtin name = eq12_r label = bq_peaking control = { "Freq" = 3750.0 "Q" = 2.222 "Gain" = -3.31 } }
          { type = builtin name = eq13_r label = bq_peaking control = { "Freq" = 4688.0 "Q" = 2.263 "Gain" = -0.01 } }
          { type = builtin name = eq14_r label = bq_peaking control = { "Freq" = 5813.0 "Q" = 2.372 "Gain" = -1.05 } }
          { type = builtin name = eq15_r label = bq_peaking control = { "Freq" = 7125.0 "Q" = 2.270 "Gain" = -2.93 } }
          { type = builtin name = eq16_r label = bq_peaking control = { "Freq" = 9000.0 "Q" = 2.170 "Gain" = 2.37 } }
          { type = builtin name = eq17_r label = bq_peaking control = { "Freq" = 11250.0 "Q" = 2.292 "Gain" = -1.34 } }
          { type = builtin name = eq18_r label = bq_peaking control = { "Freq" = 13875.0 "Q" = 1.764 "Gain" = -4.16 } }
          { type = builtin name = eq19_r label = bq_highshelf control = { "Freq" = 16528.0 "Q" = 0.707 "Gain" = -10.64 } }
          { type = builtin name = eq20_r label = bq_peaking control = { "Freq" = 380.0 "Q" = 5.000 "Gain" = -4.00 } }
          { type = builtin name = eq21_r label = bq_peaking control = { "Freq" = 495.0 "Q" = 5.000 "Gain" = -9.30 } }
          { type = builtin name = eq22_r label = bq_peaking control = { "Freq" = 1450.0 "Q" = 4.000 "Gain" = 4.00 } }
          { type = builtin name = eq23_r label = bq_peaking control = { "Freq" = 7900.0 "Q" = 6.000 "Gain" = -5.00 } }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "alr"   = 0
              "boost" = 0
              "g_in"  = 2.0      # +6 dB boost
              "th"    = 0.891    # -1 dBFS ceiling
              "lk"    = 5.0
              "at"    = 5.0
              "rt"    = 20.0
            }
          }
          { type = builtin name = woof_l label = copy }
          { type = builtin name = woof_r label = copy }
          { type = builtin name = tw_l1 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.707 } }
          { type = builtin name = tw_l2 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.707 } }
          { type = builtin name = tw_r1 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.707 } }
          { type = builtin name = tw_r2 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.707 } }
          # -3 dB: the highpass phase shift lets tweeter peaks overshoot the limiter ceiling
          { type = builtin name = tw_l_trim label = linear control = { "Mult" = 0.708 } }
          { type = builtin name = tw_r_trim label = linear control = { "Mult" = 0.708 } }
        ]

        links = [
          { output = "sub_l:Out" input = "eq00_l:In" }
          { output = "eq00_l:Out" input = "eq01_l:In" }
          { output = "eq01_l:Out" input = "eq02_l:In" }
          { output = "eq02_l:Out" input = "eq03_l:In" }
          { output = "eq03_l:Out" input = "eq04_l:In" }
          { output = "eq04_l:Out" input = "eq05_l:In" }
          { output = "eq05_l:Out" input = "eq06_l:In" }
          { output = "eq06_l:Out" input = "eq07_l:In" }
          { output = "eq07_l:Out" input = "eq08_l:In" }
          { output = "eq08_l:Out" input = "eq09_l:In" }
          { output = "eq09_l:Out" input = "eq10_l:In" }
          { output = "eq10_l:Out" input = "eq11_l:In" }
          { output = "eq11_l:Out" input = "eq12_l:In" }
          { output = "eq12_l:Out" input = "eq13_l:In" }
          { output = "eq13_l:Out" input = "eq14_l:In" }
          { output = "eq14_l:Out" input = "eq15_l:In" }
          { output = "eq15_l:Out" input = "eq16_l:In" }
          { output = "eq16_l:Out" input = "eq17_l:In" }
          { output = "eq17_l:Out" input = "eq18_l:In" }
          { output = "eq18_l:Out" input = "eq19_l:In" }
          { output = "eq19_l:Out" input = "eq20_l:In" }
          { output = "eq20_l:Out" input = "eq21_l:In" }
          { output = "eq21_l:Out" input = "eq22_l:In" }
          { output = "eq22_l:Out" input = "eq23_l:In" }
          { output = "eq23_l:Out" input = "limiter:in_l" }
          { output = "sub_r:Out" input = "eq00_r:In" }
          { output = "eq00_r:Out" input = "eq01_r:In" }
          { output = "eq01_r:Out" input = "eq02_r:In" }
          { output = "eq02_r:Out" input = "eq03_r:In" }
          { output = "eq03_r:Out" input = "eq04_r:In" }
          { output = "eq04_r:Out" input = "eq05_r:In" }
          { output = "eq05_r:Out" input = "eq06_r:In" }
          { output = "eq06_r:Out" input = "eq07_r:In" }
          { output = "eq07_r:Out" input = "eq08_r:In" }
          { output = "eq08_r:Out" input = "eq09_r:In" }
          { output = "eq09_r:Out" input = "eq10_r:In" }
          { output = "eq10_r:Out" input = "eq11_r:In" }
          { output = "eq11_r:Out" input = "eq12_r:In" }
          { output = "eq12_r:Out" input = "eq13_r:In" }
          { output = "eq13_r:Out" input = "eq14_r:In" }
          { output = "eq14_r:Out" input = "eq15_r:In" }
          { output = "eq15_r:Out" input = "eq16_r:In" }
          { output = "eq16_r:Out" input = "eq17_r:In" }
          { output = "eq17_r:Out" input = "eq18_r:In" }
          { output = "eq18_r:Out" input = "eq19_r:In" }
          { output = "eq19_r:Out" input = "eq20_r:In" }
          { output = "eq20_r:Out" input = "eq21_r:In" }
          { output = "eq21_r:Out" input = "eq22_r:In" }
          { output = "eq22_r:Out" input = "eq23_r:In" }
          { output = "eq23_r:Out" input = "limiter:in_r" }
          { output = "limiter:out_l"   input = "woof_l:In" }
          { output = "limiter:out_r"   input = "woof_r:In" }
          { output = "limiter:out_l"   input = "tw_l1:In" }
          { output = "limiter:out_r"   input = "tw_r1:In" }
          { output = "tw_l1:Out"       input = "tw_l2:In" }
          { output = "tw_r1:Out"       input = "tw_r2:In" }
          { output = "tw_l2:Out"       input = "tw_l_trim:In" }
          { output = "tw_r2:Out"       input = "tw_r_trim:In" }
        ]

        inputs  = [ "sub_l:In" "sub_r:In" ]
        # order matches playback audio.position: FL FR RL RR
        outputs = [ "woof_l:Out" "woof_r:Out" "tw_r_trim:Out" "tw_l_trim:Out" ]
      }

      capture.props = {
        node.name      = "omarchy_speaker_tuning"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name          = "omarchy_speaker_tuning_output"
        node.passive       = true
        target.object      = "alsa_output.platform-sound.HiFi__Speaker__sink"
        audio.channels     = 4
        audio.position     = [ FL FR RL RR ]
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
        # the sink already has exactly these channels; never remix them
        channelmix.disable = true
      }
    }
  }
]
