# /etc/default/a16-gpu-cap: GPU max clock in Hz while a16-gpu-cap.service is active.
# 915000000 is the highest step that does not ratchet (1070000000 sits at the cap), but on 2026-10-02 it still spent ~40 % of the time at 915; 760000000 is the step below (a16-power uses it). Top is 1850000000.
GPU_MAX_HZ=915000000
