# TPM2 auto-unlock of the LUKS root: a systemd-based initramfs (sd-encrypt reads
# rd.luks.* from the kernel command line in /etc/default/limine).
# Sorts after omarchy_*.conf, so it overrides their busybox HOOKS. resume is
# dropped on purpose: the systemd initramfs handles hibernation resume itself.
HOOKS=(base systemd plymouth keyboard autodetect microcode modconf kms sd-vconsole block sd-encrypt filesystems fsck sd-btrfs-overlayfs)
