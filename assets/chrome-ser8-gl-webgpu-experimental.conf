# SER8 experimental graphics flags, tested 2026-09-22.
# OpenGL for compositing/WebGL; native Vulkan available to WebGPU via GL interop.
# Graphics fragment: replace existing graphics switches in chrome-flags.conf;
# retain unrelated settings such as extension loading and password store.
# ForceEnableWebGpuInterop overrides Chromium's default interop block on AMD.
# Video, WebGL 2, WebGPU canvas, and MechaBlade menu checks passed in temporary
# profiles. Daily-profile flicker improvement and long-term stability unverified.
# See ../chrome-ser8-flicker-trial.md for results, activation, and rollback.
--enable-features=VaapiVideoDecoder,VaapiIgnoreDriverChecks,ForceEnableWebGpuInterop
--disable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE
--use-gl=angle
--use-angle=gl
--use-vulkan=native
