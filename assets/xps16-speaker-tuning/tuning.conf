## Dell XPS 16 (DA16260, SKU 0DBA) internal speakers -- local by-ear variants.
##
## This shadows the packaged `dell-xps-2026` tuning. omarchy-audio-tuning's
## tuning_match() walks $OMARCHY_PATH/default/audio/tunings/*/ in glob order and
## returns the FIRST directory whose match_* predicate passes, so a directory
## named `dell-xps-16-custom` is selected ahead of `dell-xps-2026`. The packaged
## tuning is left untouched on disk, which is what keeps the `stock` variant an
## honest A/B rather than a reconstruction.
##
## Everything here is UNMEASURED and tuned by ear for "sharp / hurts my ear" on
## the XPS 16. See variants/*.conf headers and build-variants.py for the curves
## and the reasoning.

description="Dell XPS 16 (2026) speakers [local, experimental]"

## ONLY 0DBA. The packaged profile also claims 0DB9 (XPS 14), where upstream
## actually measured; we have not touched that hardware and must not shadow its
## tuning. Narrowing the match is what makes this safe to install.
match_sku=("0DBA")

## Same physical sink as the packaged tuning. Unescaped dots on purpose: this
## string is passed to awk, which would consume a backslash escape before the
## regex saw it.
sink_pattern='^alsa_output.*sof_sdw.*HiFi__Speaker__sink$'

derived_from="omarchy dell-xps-2026 (packaged) + local corrective stage"
validated_by="zoan37 (by ear)"
validated_on="2026-09-17"
validated_hardware="XPS 16 DA16260 (0DBA)"
