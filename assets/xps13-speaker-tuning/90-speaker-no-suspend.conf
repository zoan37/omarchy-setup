# Keep the laptop speaker sink from suspending on idle.
#
# The Cirrus/SoundWire amp cold-starting on resume can pop or mangle the first
# fraction of a second of playback (e.g. a video that opens on speech). Keeping
# the sink running avoids the cold start, at a small battery cost. Remove this
# file and restart wireplumber to go back to default suspend behavior.
#
# Scoped to the internal speaker only -- HDMI sinks still suspend.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
