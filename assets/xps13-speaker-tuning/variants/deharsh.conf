# Dell XPS 13 DX13260 (2026) -- de-harshing tuning.
#
# Hand-fitted to a subjective complaint ("too sharp"), not measured. This is
# deliberately a much smaller intervention than the shipped dell-xps-2026 curve:
# it targets the presence region and otherwise leaves the voicing alone, because
# the XPS 13's own Cirrus smart-amp firmware is already loading and doing the
# hardware-level correction.
#
# Design notes:
#
#   55 Hz high-pass   These drivers produce nothing below this; removing it frees
#                     excursion and headroom, which is itself a distortion (and
#                     therefore harshness) reduction.
#   +2 dB @ 200 Hz    Cutting presence without restoring some low-mid reads as
#                     thin, which paradoxically sounds sharper. Kept small: large
#                     bass boosts on small drivers create intermodulation
#                     distortion, which is harshness.
#   -6 dB @ 3.5 kHz   The main cut. Broad (Q 1.1) on purpose -- ear fatigue is a
#                     wideband phenomenon, and a narrow notch just moves the peak.
#   -3.5 dB @ 5 kHz   Upper edge of the presence peak.
#   -3 dB shelf 7.5k  Sibilance and air. Gentle; this is the band most likely to
#                     be overcorrected into dullness.
#
# Net gain is negative everywhere except a 2 dB low-mid lift, so this is roughly
# level-matched to stock -- unlike the XPS 14 curve, which is ~5 dB quieter and
# therefore impossible to A/B honestly without compensating.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l label = bq_highpass  control = { "Freq" = 55.0   "Q" = 0.707 } }
          { type = builtin name = s1_l label = bq_peaking   control = { "Freq" = 200.0  "Q" = 0.9  "Gain" = 2.0 } }
          { type = builtin name = s2_l label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.1  "Gain" = -6.0 } }
          { type = builtin name = s3_l label = bq_peaking   control = { "Freq" = 5000.0 "Q" = 1.6  "Gain" = -3.5 } }
          { type = builtin name = s4_l label = bq_highshelf control = { "Freq" = 7500.0 "Q" = 0.7  "Gain" = -3.0 } }

          { type = builtin name = s0_r label = bq_highpass  control = { "Freq" = 55.0   "Q" = 0.707 } }
          { type = builtin name = s1_r label = bq_peaking   control = { "Freq" = 200.0  "Q" = 0.9  "Gain" = 2.0 } }
          { type = builtin name = s2_r label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.1  "Gain" = -6.0 } }
          { type = builtin name = s3_r label = bq_peaking   control = { "Freq" = 5000.0 "Q" = 1.6  "Gain" = -3.5 } }
          { type = builtin name = s4_r label = bq_highshelf control = { "Freq" = 7500.0 "Q" = 0.7  "Gain" = -3.0 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              # -1 dB in. Only enough to cover the 2 dB low-mid lift; the point
              # is a safety catch, not the ~5 dB attenuation the XPS 14 curve
              # needs for its much larger boosts.
              "g_in"  = 0.891
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "limiter:in_l" }

          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
