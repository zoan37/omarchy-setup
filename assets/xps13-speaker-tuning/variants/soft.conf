# Dell XPS 13 DX13260 (2026) -- "soft" tuning. EXPERIMENTAL, UNMEASURED.
#
# A warmer, darker variant of the de-harsh curve, built for a report of "tiny and
# whiny". Two changes matter more than the rest:
#
#   -4.5 dB @ 1.6 kHz  New. "Whiny" and "nasal" live here, and the de-harsh curve
#                      did not touch this band at all -- it started cutting at
#                      3.5 kHz, which is why the sharpness went but the whine
#                      stayed.
#   80 Hz high-pass    Raised from 55 Hz. Counterintuitive but this is the main
#                      lever for "tiny": these drivers cannot produce 55-80 Hz at
#                      any useful level, and trying costs excursion that the
#                      Cirrus amp's protection then takes back out of the
#                      150-300 Hz band -- where they *can* play. High-passing
#                      higher lets the mid-bass get louder, not quieter.
#
# The +3.5 dB at 180 Hz is deliberately placed where the drivers have real
# output rather than lower where it would only generate intermodulation
# distortion. There is no way to give small drivers actual bass; warmth here is
# bought mostly by taking away upper mids, not by adding low end.
#
# Local revision (2026-08-14, diverges from the packaged deharsh profile):
# female speech still pierced slightly. Widened 3.2 kHz (Q 1.0 -> 0.8, covers the
# 2.2-2.5 kHz gap between the 1.6k and 3.2k bands and the 4 kHz side) and 5 kHz
# (Q 1.6 -> 1.1, -4 -> -5 dB, for sibilance). `omarchy audio tuning on --force`
# or an update reinstall would overwrite this.
#
# Risk of this profile: dull, boxy, or muffled. That is the expected failure
# direction, and it is the trade being made on purpose.
#
# Channels are wired explicitly because the limiter is a stereo plugin; a mono
# graph is duplicated per channel and would limit each side independently,
# shifting the stereo image on bass transients.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l label = bq_highpass  control = { "Freq" = 80.0   "Q" = 0.707 } }
          { type = builtin name = s1_l label = bq_peaking   control = { "Freq" = 180.0  "Q" = 0.8  "Gain" = 3.5 } }
          { type = builtin name = s2_l label = bq_peaking   control = { "Freq" = 1600.0 "Q" = 1.2  "Gain" = -4.5 } }
          { type = builtin name = s3_l label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 0.8  "Gain" = -7.5 } }
          { type = builtin name = s4_l label = bq_peaking   control = { "Freq" = 5000.0 "Q" = 1.1  "Gain" = -5.0 } }
          { type = builtin name = s5_l label = bq_highshelf control = { "Freq" = 7000.0 "Q" = 0.7  "Gain" = -4.5 } }

          { type = builtin name = s0_r label = bq_highpass  control = { "Freq" = 80.0   "Q" = 0.707 } }
          { type = builtin name = s1_r label = bq_peaking   control = { "Freq" = 180.0  "Q" = 0.8  "Gain" = 3.5 } }
          { type = builtin name = s2_r label = bq_peaking   control = { "Freq" = 1600.0 "Q" = 1.2  "Gain" = -4.5 } }
          { type = builtin name = s3_r label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 0.8  "Gain" = -7.5 } }
          { type = builtin name = s4_r label = bq_peaking   control = { "Freq" = 5000.0 "Q" = 1.1  "Gain" = -5.0 } }
          { type = builtin name = s5_r label = bq_highshelf control = { "Freq" = 7000.0 "Q" = 0.7  "Gain" = -4.5 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              # -2 dB in, covering most of the 3.5 dB low-mid lift. The limiter
              # catches the rest rather than paying for it in headroom.
              "g_in"  = 0.794
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "limiter:in_l" }

          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
        # Keep the chain processing (silence) even with no app playing, so the
        # speaker PCM never stops and the CS35L56 amps never runtime-suspend --
        # their 100ms-autosuspend power-down after each stream is the snap/pop
        # heard when a video stops. Costs: constant tiny DSP load + amps always
        # powered. Revert with node.passive = true below and this line removed.
        node.always-process = true
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = false
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
