## Dell XPS 13 DX13260 (2026) -- de-harshing tuning. EXPERIMENTAL, UNMEASURED.
##
## Unlike the shipped dell-xps-2026 tuning, this is not a fit to a reference. It
## is a hand-built corrective curve aimed at one reported symptom ("too sharp")
## on this specific machine, and it is expected to be iterated on by ear.
##
## The XPS 13 loads Dell's own Cirrus smart-amp firmware for its SSID
## (cs35l56-b2-dsp1-misc-10280e53-*), so the hardware protection and voicing
## layer underneath is already correct. This only trims the presence region on
## top of it.
##
## Remove this directory to revert. It lives under a package-owned path and will
## be dropped by the next Omarchy update.

description="Dell XPS 13 (2026) speakers [de-harsh, experimental]"

## 0E53 = XPS 13 DX13260. Whole-value match, same as the shipped tuning.
match_sku=("0E53")

## Unescaped dots: passed to awk as a string, where a backslash escape would be
## consumed before the regex sees it.
sink_pattern='^alsa_output.*sof_sdw.*HiFi__Speaker__sink$'

derived_from="hand-fitted by ear to a reported harshness complaint"
validated_by="nobody -- unmeasured"
validated_hardware="none"
