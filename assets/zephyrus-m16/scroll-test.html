<!doctype html><meta charset="utf-8"><title>Zephyrus repeatable scroll test</title><style>body{background:#171c24;color:#e5eaf3;font:18px system-ui;margin:0}header{position:fixed;top:0;background:#26374a;padding:14px;width:100%;z-index:1}main{max-width:850px;margin:90px auto}article{padding:22px;margin:14px;border:1px solid #4a5e78;border-radius:12px;background:linear-gradient(120deg,#253044,#192430)}.pic{height:90px;background:linear-gradient(25deg,#55818b,#35465e);border-radius:8px}</style><header>Repeatable 165 Hz scrolling test — temporary browser window</header><main></main><script>
const main=document.querySelector('main');for(let i=0;i<300;i++){const a=document.createElement('article');a.innerHTML='<b>Local sample '+i+'</b><p>A fixed page with text, gradients and cards. No network requests, videos, accounts or extensions.</p><div class="pic"></div>';main.append(a)}
window.samples=[];window.runStart=performance.now();let last=0;
function tick(t){if(last) samples.push({t:Date.now(),dt:t-last});last=t;const phase=((t-runStart)%16000)/16000;window.scrollTo(0,(1-Math.cos(phase*2*Math.PI))*1500);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
